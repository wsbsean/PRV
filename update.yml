name: Update PostPulse data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public posts and calculate baselines
        run: python collector.py
      - name: Commit updated data
        run: |
          git config user.name "postpulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json data/statistics.json
          git diff --cached --quiet || git commit -m "Update activity data"
          git push
